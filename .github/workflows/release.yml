# Every push to main builds a universal Shotlate.app, packs it into a DMG and publishes a GitHub release
# whose notes list the commits since the previous release.
#
# Version: major.minor come from CFBundleShortVersionString in Resources/Info.plist; the patch number
# counts up from the latest vX.Y.* tag. Bump Info.plist to 0.2.0 to start the 0.2 series.
# Put "[skip release]" in a commit message to push without releasing.
#
# Signing: every release is signed with the shared self-signed "Shotlate Release" certificate (scripts/sign-app.sh),
# which keeps the Screen Recording permission across updates, and its DMG with Sparkle's EdDSA key, which
# is how installed copies tell a real update from anything else. Required repository secrets:
#   MACOS_CERTIFICATE           base64 of shotlate.p12 (the self-signed certificate and its key)
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   SPARKLE_ED_PRIVATE_KEY      EdDSA private key; its public half is SUPublicEDKey in Resources/Info.plist
# Each release also carries appcast.xml, which installed copies read from
# https://github.com/zuijiaosy/shotlate/releases/latest/download/appcast.xml (SUFeedURL).
#
# Cloudflare R2 (optional): the DMG is also uploaded to an R2 bucket, as Shotlate-<version>.dmg and as
# Shotlate-latest.dmg, which the website can link to. Skipped until both of these are set:
#   secret   CLOUDFLARE_API_TOKEN    API token with "Workers R2 Storage: Edit"
#   secret   CLOUDFLARE_ACCOUNT_ID   the Cloudflare account ID
#   variable R2_BUCKET               bucket name (Settings → Secrets and variables → Actions → Variables)
#   variable R2_PUBLIC_URL           optional, e.g. https://dl.example.com; when set, appcast.xml points
#                                    downloads there instead of at the GitHub release
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: macos-26
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test
        run: scripts/test.sh

      - name: Pick version
        id: version
        run: |
          base="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          major_minor="${base%.*}"
          last="$(git tag -l "v${major_minor}.*" --sort=-v:refname | head -1)"
          if [ -n "$last" ]; then
            version="${major_minor}.$(( ${last##*.} + 1 ))"
          else
            version="$base"
          fi
          previous="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (previous: ${previous:-none})"

      - name: Signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          # An unsigned release would cost every user their Screen Recording permission, so don't ship one.
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::error::Secret MACOS_CERTIFICATE is missing; see the comment at the top of this file"
            exit 1
          fi
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/shotlate.p12"
          echo "SIGNING_P12=$RUNNER_TEMP/shotlate.p12" >> "$GITHUB_ENV"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          ARCHS: arm64 x86_64
          SIGNING_P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          scripts/build-app.sh
          lipo -archs build/Shotlate.app/Contents/MacOS/Shotlate
          codesign -dvv build/Shotlate.app 2>&1 | grep -q '^Authority=Shotlate Release$' \
            || { echo "::error::Shotlate.app is not signed with the Shotlate Release certificate"; exit 1; }

      - name: Package DMG
        run: scripts/make-dmg.sh "${{ steps.version.outputs.version }}"

      - name: Write release notes
        run: |
          scripts/release-notes.sh "${{ steps.version.outputs.previous }}" > "$RUNNER_TEMP/changes.md"
          {
            cat "$RUNNER_TEMP/changes.md"
            echo "### 安装"
            echo
            echo "下载 \`Shotlate-${{ steps.version.outputs.version }}.dmg\`，打开后把 Shotlate 拖进「应用程序」。支持 macOS 14 及以上，Apple 芯片和 Intel 通用。已经装了带自动更新的版本的，会在菜单栏菜单里收到更新提示，不用再手动下载。"
            echo
            echo "Shotlate 没有经过 Apple 公证，首次打开时请在「应用程序」里右键 Shotlate →「打开」；如果提示「已损坏」，在终端运行 \`xattr -dr com.apple.quarantine /Applications/Shotlate.app\`。"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Sign update and write appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::Secret SPARKLE_ED_PRIVATE_KEY is missing; see the comment at the top of this file"
            exit 1
          fi
          version="${{ steps.version.outputs.version }}"
          if [ -n "$R2_PUBLIC_URL" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$R2_BUCKET" ]; then
            url="${R2_PUBLIC_URL%/}/Shotlate-$version.dmg"
          else
            url="https://github.com/${{ github.repository }}/releases/download/v$version/Shotlate-$version.dmg"
          fi
          scripts/make-appcast.sh "$version" "${{ github.run_number }}" "build/Shotlate-$version.dmg" "$url" \
            "$RUNNER_TEMP/changes.md" > build/appcast.xml
          cat build/appcast.xml

      - name: Upload DMG to Cloudflare R2
        if: env.CLOUDFLARE_API_TOKEN != '' && env.R2_BUCKET != ''
        run: |
          version="${{ steps.version.outputs.version }}"
          dmg="build/Shotlate-$version.dmg"
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/Shotlate-$version.dmg" --file "$dmg" \
            --content-type application/x-apple-diskimage --remote
          # A fixed name for "download the latest"; not cached, so a new release shows up right away.
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/Shotlate-latest.dmg" --file "$dmg" \
            --content-type application/x-apple-diskimage --cache-control "no-cache" --remote

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          # appcast.xml goes up with the DMG; installed copies find it through releases/latest.
          gh release create "v$version" "build/Shotlate-$version.dmg" build/appcast.xml \
            --target "$GITHUB_SHA" \
            --title "Shotlate $version" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Upload appcast to Cloudflare R2
        if: env.CLOUDFLARE_API_TOKEN != '' && env.R2_BUCKET != ''
        run: |
          # Last, so it never points at a DMG that isn't there yet.
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/appcast.xml" --file build/appcast.xml \
            --content-type application/xml --cache-control "no-cache" --remote
